    <path d="M910 129A86 86 0 0 1 1004 96" stroke="#FFE0B1" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="856" cy="224" r="4" fill="#E6BD91"/>
    <circle cx="1122" cy="104" r="3" fill="#D6AA7F"/>
    <circle cx="1088" cy="275" r="2.5" fill="#8EA0B4"/>
