<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ecipsed</title>
  <desc id="desc">A copper eclipse above subtle orbital paths. Exploring how models learn, adapt, and combine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111821"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0.32" stop-color="#E6AF78" stop-opacity="0.2"/>
      <stop offset="0.53" stop-color="#CD8350" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#CD8350" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="886" y1="80" x2="1060" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9D6A4"/>
      <stop offset="0.45" stop-color="#D68B56"/>
      <stop offset="0.8" stop-color="#64442F"/>
      <stop offset="1" stop-color="#C79368"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.24" cy="0.16" r="0.88">
      <stop stop-color="#1C242D"/>
      <stop offset="0.65" stop-color="#10151D"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#A7B4C5" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="clip"><rect width="1280" height="384" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
