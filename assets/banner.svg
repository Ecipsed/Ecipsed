    <path d="M72 63H97" stroke="#E3B386" stroke-width="2"/>
    <text x="110" y="68" fill="#AFBAC6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2.8">A PERSONAL RESEARCH SPACE</text>
    <text x="68" y="174" fill="#F2F0EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="650" letter-spacing="-3">Ecipsed<tspan fill="#E4B083">.</tspan></text>
    <text x="73" y="221" fill="#C2CBD5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Exploring how models learn, adapt, and combine.</text>
    <path d="M73 258H586" stroke="#29323D"/>
    <text x="73" y="290" fill="#DAB08A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.1">MODEL MERGING</text>
    <circle cx="225" cy="286" r="2" fill="#53606F"/>
    <text x="244" y="290" fill="#A2B0BF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.1">CONTINUAL LEARNING</text>
    <circle cx="435" cy="286" r="2" fill="#53606F"/>
    <text x="454" y="290" fill="#A2B0BF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.1">OPEN RESEARCH</text>
    <circle cx="981" cy="179" r="205" fill="url(#halo)"/>
    <circle cx="981" cy="179" r="144" stroke="#BA966D" stroke-opacity="0.14" stroke-dasharray="2 8"/>
    <circle cx="981" cy="179" r="114" stroke="#BA966D" stroke-opacity="0.12"/>
    <ellipse cx="981" cy="179" rx="224" ry="61" transform="rotate(-31 981 179)" stroke="#8093A7" stroke-opacity="0.2"/>
    <ellipse cx="981" cy="179" rx="188" ry="92" transform="rotate(36 981 179)" stroke="#8093A7" stroke-opacity="0.12"/>
    <circle cx="981" cy="179" r="88" fill="#D5A06D" fill-opacity="0.03" stroke="#D9A573" stroke-opacity="0.15" stroke-width="10"/>
